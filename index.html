<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day, Ely! ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="hearts-background">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>
        
        <div class="card">
            <h1 class="title">Happy Valentine's Day, Ely! ❤️</h1>
            <div class="main-heart" id="mainHeart">
                <svg width="200" height="200" viewBox="0 0 100 100">
                    <path d="M50,90 C50,90 10,60 10,40 C10,25 20,15 30,15 C40,15 50,25 50,25 C50,25 60,15 70,15 C80,15 90,25 90,40 C90,60 50,90 50,90 Z" fill="#ff1744"/>
                </svg>
            </div>
            
            <p class="message">
                You make every day feel like Valentine's Day! 💕<br>
                Thank you for being amazing!
            </p>
            
            <button class="btn" id="surpriseBtn">Click for a surprise! 🎁</button>
            
            <div class="surprise" id="surprise">
                <p class="surprise-text">
                    🌹 Roses are red,<br>
                    💙 Violets are blue,<br>
                    ✨ There's no one more special,<br>
                    💖 Than you!
                </p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
